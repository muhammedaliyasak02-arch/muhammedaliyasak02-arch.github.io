<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ORMANCIOGLU</title>
    <style>
        body {
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #00d2d3;
        }
        .kart {
            background-color: #2d2d44;
            display: inline-block;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #black;
        }
    </style>
</head>
<body>

    <div class="kart">
        <h1>YASAK AİLESİ</h1>
        <p>!AİLE GURURUMUZ</p>
        <button onclick="mesajVer()">DEVAM  
</button>
    </div>

    <script>
        function mesajVer() {
            alert("AİLE SAYFAMIZA HOŞGELDİNİZ.");
        }
    </script>

</body>
</html>
